# main に push されたら、仮データで書き出したプレビューを GitHub Pages に公開する。
# 本番（Cloudflare Workers / SSR）とは別物。URL: https://general-ss-system.github.io/ami_HP/
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1本ずつ。途中の実行は後から来た実行を優先して取り消す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 型チェックとテストが通らない状態は公開しない
      - run: pnpm check
      - run: pnpm test

      - run: pnpm build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
